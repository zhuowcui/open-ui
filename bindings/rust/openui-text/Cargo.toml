[package]
name = "openui-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Deterministic font resolution, metrics, bidi, and shaping for Open UI"

[dependencies]
openui-style = { version = "=0.2.0", path = "../openui-style" }
openui-geometry = { version = "=0.2.0", path = "../openui-geometry" }
skia-safe = { version = "0.94", features = ["textlayout", "freetype-woff2"] }
unicode-script = "0.5"
unicode-bidi = "0.3"
unicode-segmentation = "1.10"
skrifa = { version = "0.40.0" }

# DirectWrite cannot load WOFF or WOFF2 containers. Windows decodes them to
# sfnt first, as Chromium's OpenType Sanitizer does before the platform scaler.
[target.'cfg(windows)'.dependencies]
wuff = "=0.2.9"
