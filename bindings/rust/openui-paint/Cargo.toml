[package]
name = "openui-paint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Exact fragment-to-Skia picture recording and software raster for Open UI"

[dependencies]
openui-style = { version = "=0.2.0", path = "../openui-style" }
openui-geometry = { version = "=0.2.0", path = "../openui-geometry" }
openui-layout = { version = "=0.2.0", path = "../openui-layout" }
openui-dom = { version = "=0.2.0", path = "../openui-dom" }
openui-text = { version = "=0.2.0", path = "../openui-text" }
skia-safe = "0.94"
unicode-segmentation = "1.10"

[dev-dependencies]
png = "0.17"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "paint_benchmarks"
harness = false
