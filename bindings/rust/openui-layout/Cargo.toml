[package]
name = "openui-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Exact block, flex, grid, inline, table, and fragmentation layout for Open UI"

[dependencies]
openui-style = { version = "=0.2.0", path = "../openui-style" }
openui-geometry = { version = "=0.2.0", path = "../openui-geometry" }
openui-dom = { version = "=0.2.0", path = "../openui-dom" }
openui-text = { version = "=0.2.0", path = "../openui-text" }
unicode-linebreak = "0.1"
unicode-segmentation = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "layout_benchmarks"
harness = false
