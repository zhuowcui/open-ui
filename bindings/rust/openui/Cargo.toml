[package]
name = "openui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Typed reactive Linux and headless application framework over the Open UI engine"

[features]
default = []
linux = ["dep:openui-platform", "openui-platform/linux"]
ffi-integration = []

[dependencies]
openui-compositor = { version = "=0.2.0", path = "../openui-compositor" }
openui-dom = { version = "=0.2.0", path = "../openui-dom" }
openui-engine = { version = "=0.2.0", path = "../openui-engine" }
openui-macros = { version = "=0.2.0", path = "../openui-macros" }
openui-platform = { version = "=0.2.0", path = "../openui-platform", optional = true }
openui-style = { version = "=0.2.0", path = "../openui-style" }
openui-text = { version = "=0.2.0", path = "../openui-text" }
