[package]
name = "openui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Typed reactive Linux and headless application framework over the Open UI engine"

[features]
default = []
linux = ["dep:openui-platform", "openui-platform/linux"]
windows = ["dep:openui-platform", "openui-platform/windows"]
# The native runtime of the host: Win32 on Windows, X11 and Wayland on Linux.
# Platform code is gated on both the feature and the target, so enabling
# both platform features selects the host one.
desktop = ["linux", "windows", "async"]
# UI and background tasks (`task`), `Signal::sender` and `create_resource`.
async = ["dep:async-executor", "dep:async-io", "dep:async-task", "dep:blocking", "dep:futures-lite"]
# App menus (`menu`): native on Windows; accelerators and roles everywhere.
menu = ["desktop", "openui-platform/menu"]
# Native open, save and folder dialogs (`dialog`).
dialog = ["desktop", "openui-platform/dialog"]
ffi-integration = []

[dependencies]
async-executor = { version = "=1.14.1", optional = true }
async-io = { version = "=2.6.0", optional = true }
async-task = { version = "=4.7.1", optional = true }
blocking = { version = "=1.7.0", optional = true }
futures-lite = { version = "=2.6.1", optional = true }
openui-compositor = { version = "=0.2.0", path = "../openui-compositor" }
openui-dom = { version = "=0.2.0", path = "../openui-dom" }
openui-engine = { version = "=0.2.0", path = "../openui-engine" }
openui-macros = { version = "=0.2.0", path = "../openui-macros" }
openui-platform = { version = "=0.2.0", path = "../openui-platform", optional = true }
openui-style = { version = "=0.2.0", path = "../openui-style" }
openui-text = { version = "=0.2.0", path = "../openui-text" }

[dev-dependencies]
serde_json = "1.0"
