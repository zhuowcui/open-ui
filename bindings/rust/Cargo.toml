[workspace]
resolver = "2"
members = [
    "openui-geometry",
    "openui-style",
    "openui-dom",
    "openui-layout",
    "openui-paint",
    "openui-text",
    "openui-sys",
    "openui",
    "openui-macros",
    "openui-build",
    "examples/hello",
    "examples/counter",
    "examples/todo",
    "examples/dashboard",
    "pixel-compare",
]

[patch.crates-io]
skia-safe = { git = "https://github.com/rust-skia/rust-skia.git", rev = "c19a70ee1e5ea5a7790ee05a9b6f5fa3c05fae09" }
skia-bindings = { git = "https://github.com/rust-skia/rust-skia.git", rev = "c19a70ee1e5ea5a7790ee05a9b6f5fa3c05fae09" }
skrifa = { path = "vendor/skrifa-v0_40" }
read-fonts = { path = "vendor/read-fonts-v0_37" }
font-types = { path = "vendor/font-types-v0_11" }
bytemuck = { path = "vendor/bytemuck-v1" }
bytemuck_derive = { path = "vendor/bytemuck_derive-v1" }
