<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>box-decoration-break: slice</title>
<style>body { margin: 0; padding: 20px; font-family: Arial, sans-serif; font-size: 16px; }</style>
</head>
<body>
<div style='width:200px; line-height:2;'><span style='box-decoration-break:slice; -webkit-box-decoration-break:slice; background:#e74c3c; color:white; padding:4px 8px;'>The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump.</span></div>
</body>
</html>
