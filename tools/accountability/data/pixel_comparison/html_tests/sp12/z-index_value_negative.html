<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>z-index: negative</title>
<style>body { margin: 0; padding: 20px; font-family: Arial, sans-serif; font-size: 16px; }</style>
</head>
<body>
<div style='position:relative; width:300px; height:200px;'><div style='position:absolute; top:0; left:0; width:120px; height:120px; background:#e74c3c; z-index:1;'></div><div style='position:absolute; top:40px; left:40px; width:120px; height:120px; background:#3498db; z-index:-1;'></div></div>
</body>
</html>
