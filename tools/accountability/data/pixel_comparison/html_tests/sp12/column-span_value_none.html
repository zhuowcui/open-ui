<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>column-span: none</title>
<style>body { margin: 0; padding: 20px; font-family: Arial, sans-serif; font-size: 16px; }</style>
</head>
<body>
<div style='column-count:3; width:500px; background:#f0f0f0; padding:10px;'><p>The quick brown fox jumps over the lazy dog</p><h2 style='column-span:none; background:#e74c3c; color:white; padding:8px;'>Spanning heading</h2><p>The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump.</p></div>
</body>
</html>
