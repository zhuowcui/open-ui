<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flex-wrap: nowrap</title>
<style>body { margin: 0; padding: 20px; font-family: Arial, sans-serif; font-size: 16px; }</style>
</head>
<body>
<div style='display:flex; flex-wrap:nowrap; width:200px; gap:5px; background:#f0f0f0; padding:10px;'><div style='width:80px; height:50px; background:hsl(0,70%,50%); color:white; display:flex; align-items:center; justify-content:center;'>1</div><div style='width:80px; height:50px; background:hsl(60,70%,50%); color:white; display:flex; align-items:center; justify-content:center;'>2</div><div style='width:80px; height:50px; background:hsl(120,70%,50%); color:white; display:flex; align-items:center; justify-content:center;'>3</div><div style='width:80px; height:50px; background:hsl(180,70%,50%); color:white; display:flex; align-items:center; justify-content:center;'>4</div></div>
</body>
</html>
