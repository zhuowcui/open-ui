<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text-shadow: multiple-shadows</title>
<style>body { margin: 0; padding: 20px; font-family: Arial, sans-serif; font-size: 16px; }</style>
</head>
<body>
<p style="text-shadow:2px 2px 0 #e74c3c, -2px -2px 0 #3498db; font-size:28px;">The quick brown fox jumps over the lazy dog</p>
</body>
</html>
