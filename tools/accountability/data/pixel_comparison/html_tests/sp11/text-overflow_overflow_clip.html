<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text-overflow: clip</title>
<style>body { margin: 0; padding: 20px; font-family: Arial, sans-serif; font-size: 16px; }</style>
</head>
<body>
<div style="width:200px; white-space:nowrap; overflow:hidden; text-overflow:clip; background:#f0f0f0; padding:8px;">The quick brown fox jumps over the lazy dog</div>
</body>
</html>
