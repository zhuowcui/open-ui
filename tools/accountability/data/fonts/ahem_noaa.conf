<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  SP14 deterministic text rendering (memory 0027).

  Chrome headless is pointed at this config via FONTCONFIG_FILE by
  run_all_pixel_comparisons.py::render_chrome only for IDs in
  text_ported_tests.json. It:
    1. includes the normal system font configuration (verified bit-identical
       rendering for all non-Ahem text, e.g. DejaVu Sans), and
    2. registers the repo-vendored Ahem and Chromium-pinned Droid/Noto fallback
       bytes (the same files OpenUI pins in-process via OrderedFontMgr), and
    3. disables antialiasing/hinting for the explicit ordered family chain, so
       Chrome rasterizes the complete opted-in repertoire exactly like OpenUI's
       coverage-threshold rasterizer. This file is manifest scoped and never
       changes the legacy corpus environment.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- prefix="relative" resolves against this file's directory -->
  <dir prefix="relative">../../../../bindings/rust/openui-text/fonts</dir>
  <match target="font">
    <test name="family" compare="eq">
      <string>Ahem</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Droid Sans Fallback</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Noto Sans Devanagari</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>DejaVu Sans</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
