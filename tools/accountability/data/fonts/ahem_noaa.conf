<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  SP14 deterministic text rendering (memory 0027).

  Chrome headless is pointed at this config via FONTCONFIG_FILE by
  run_all_pixel_comparisons.py::render_chrome only for IDs in
  text_ported_tests.json. It:
    1. includes the normal system font configuration (verified bit-identical
       rendering for all non-Ahem text, e.g. DejaVu Sans), and
    2. registers the repo-vendored Ahem.ttf (the same file OpenUI pins
       in-process via OrderedFontMgr), and
    3. disables antialiasing/hinting for the Ahem family only, so Chrome
       rasterizes Ahem glyphs binary {0,255} exactly like OpenUI's
       coverage-threshold rasterizer. Verified: 0/471000 mismatched pixels
       on the Ahem smoke test; 0 pixel diffs on DejaVu content.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- prefix="relative" resolves against this file's directory -->
  <dir prefix="relative">../../../../bindings/rust/openui-text/fonts</dir>
  <match target="font">
    <test name="family" compare="eq">
      <string>Ahem</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
