<!DOCTYPE html><html><head><style style="display:none!important">* { margin: 0; padding: 0; box-sizing: content-box; } *, *::before, *::after { animation-play-state: paused !important; } ::-webkit-scrollbar { display: none; } html { overflow: hidden; } body { margin: 0; padding: 20px; font-family: DejaVu Sans, sans-serif; font-size: 16px; color: black; background-color: white; }</style></head><body><style>
  .multicol {
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
    margin-left: -100px;
    margin-top: -50px;
  }
  .rel {
    position: relative;
  }
  .abs {
    position: absolute;
    background-color: green;
    height: 200px;
    width: 50px;
    top: 0px;
  }
</style>
<div class="multicol">
  <div class="rel" style="top: 50px; left: 100px;">
    <span class="abs">
      <div style="height: 200px; width: 50px; background: red;"></div>
      <div class="abs"></div>
    </span>
  </div>
</div>
<style style="display:none!important">body, body * { font-family: Ahem, "DejaVu Sans" !important; font-weight: normal !important; font-style: normal !important; font-synthesis: none !important; text-decoration: none !important; list-style: none !important; font-kerning: none !important; font-variant-ligatures: none !important; }</style><style>div.abs { background-color: transparent !important; }</style></body></html>
