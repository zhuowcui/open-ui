<!DOCTYPE html><html><head><style style="display:none!important">* { margin: 0; padding: 0; box-sizing: content-box; } *, *::before, *::after { animation-play-state: paused !important; } ::-webkit-scrollbar { display: none; } html { overflow: hidden; } body { margin: 0; padding: 20px; font-family: DejaVu Sans, sans-serif; font-size: 16px; color: black; background-color: white; }</style></head><body><style>
  .multicol {
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
    height: 100px;
    width: 100px;
    margin-left: -300px;
  }
  .rel {
    position: relative;
  }
  .abs {
    position: absolute;
    width: 50px;
    height: 200px;
  }
  .fixed {
    position: fixed;
    width: 50px;
    height: 200px;
    background: transparent;
  }
</style>
<div class="multicol">
  <div style="transform: translateX(0);">
    <div style="height: 200px;"></div>
    <div class="rel">
      <div style="height: 200px;"></div>
      <div class="abs">
        <div style="height: 200px;"></div>
        <div class="abs" style="top: 200px; background: red;"></div>
        <div class="fixed"></div>
      </div>
    </div>
  </div>
</div>
<style style="display:none!important">body, body * { font-family: Ahem, "Droid Sans Fallback", "Noto Sans Devanagari", "Noto Color Emoji", "DejaVu Sans" !important; font-weight: normal !important; font-style: normal !important; font-synthesis: none !important; text-decoration: none !important; list-style: none !important; font-kerning: none !important; font-variant-ligatures: none !important; }</style></body></html>
