<!DOCTYPE html><html><head><style style="display:none!important">* { margin: 0; padding: 0; box-sizing: content-box; } *, *::before, *::after { animation-play-state: paused !important; } ::-webkit-scrollbar { display: none; } html { overflow: hidden; } body { margin: 0; padding: 20px; font-family: DejaVu Sans, sans-serif; font-size: 16px; color: black; background-color: white; }</style></head><body><style>
  .multicol {
    column-count: 2;
    column-fill: auto;
    column-gap: 0px;
  }
  #outer {
    height: 100px;
    width: 100px;
  }
  #inner {
    background-color: red;
    width: 50px;
    position: relative;
  }

    position: relative;
    height: 200px;
  }
  .abs {
    position: absolute;
    background-color: green;
  }
</style>
<div class="multicol" id="outer"><div class="multicol" id="inner"><div class="abs" style="width: 50px; height: 100px; top: 100px;"></div><div class="rel"><div class="abs" style="width: 25px; height: 200px;"></div></div></div></div><style>.abs{background:transparent !important}</style></body></html>
