<!doctype html><meta charset="utf-8"><title>Native column image: height-div</title>
<style>
*{margin:0;padding:0;box-sizing:content-box}
html{overflow:hidden}body{padding:20px;background:white;font-size:16px}
.columns{display:block;width:100px;height:30px;column-width:30px;column-fill:auto;border:2px solid orange}
.limit{display:block;height:40px;background:teal;border:5px solid black;border-top-width:0}
.image{display:block;width:50%;height:80px;background:salmon}
.following{display:block;width:50%;height:80px;background:purple}
</style><div class="columns"><div class="limit"><div class="image"></div><div class="following"></div></div></div>
