<!DOCTYPE html>
<!--
  The browser side of the home page's comparison: the card in
  site/showcase/src/example.rs, written as HTML with the same inline styles.
  Open UI has no user-agent stylesheet, so the reset below takes the
  browser's away for the elements the card uses (body margin, p margins and
  the button's border, padding, background and font). The wrapper repeats
  the showcase renderer's page: Geist at 14px, line height 1.5, the card
  centred in a 440x220 viewport. capture.py draws it with the pinned
  Chromium.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>example</title>
<style>
  @font-face {
    font-family: Geist;
    src: url("../../../components/assets/fonts/geist/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  body { margin: 0; }
  p { margin: 0; }
  button {
    margin: 0;
    padding: 0;
    border: 0 solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    line-height: inherit;
    text-align: start;
  }
</style>
</head>
<body style="background-color: #ffffff; color: oklch(0.145 0 0)">
<div style="font-family: Geist; line-height: 1.5; font-size: 14px">
<div style="display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden">
  <div style="box-sizing: border-box; width: 360px; padding: 24px; border: 1px solid #e5e5e5; border-radius: 14px">
    <div style="display: flex; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 600">Production</span>
      <span style="padding: 2px 8px; border-radius: 9999px; background-color: #dcfce7; color: #166534; font-size: 12px; font-weight: 500">Live</span>
    </div>
    <p style="margin: 4px 0 20px; color: #737373">Deploy #12 went out 4 minutes ago</p>
    <div style="display: flex; gap: 8px">
      <button style="padding: 6px 12px; border-radius: 6px; background-color: #171717; color: #fafafa; font-weight: 500">Redeploy</button>
      <button style="padding: 5px 12px; border: 1px solid #e5e5e5; border-radius: 6px; font-weight: 500">View logs</button>
    </div>
  </div>
</div>
</div>
</body>
</html>
