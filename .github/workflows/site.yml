name: site

# The project website in site/ (Astro and Starlight). Pull requests build
# it; pushes to main build and deploy it to GitHub Pages. It never builds
# Skia or Rust: the app screenshots are committed PNGs rendered by
# site/showcase, and the fonts are copied and hash-checked by
# site/scripts/sync-assets.mjs. The element table is checked against the
# Rust source it is generated from (site/scripts/gen-reference.mjs), so a
# change to those files also runs this workflow.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "bindings/rust/openui/src/element.rs"
      - "bindings/rust/openui-engine/src/lib.rs"
      - "bindings/rust/openui-engine/src/accessibility.rs"
      - "bindings/rust/openui-engine/src/interaction.rs"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "bindings/rust/openui/src/element.rs"
      - "bindings/rust/openui-engine/src/lib.rs"
      - "bindings/rust/openui-engine/src/accessibility.rs"
      - "bindings/rust/openui-engine/src/interaction.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: site-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      # Only the site, the fonts it copies (site/scripts/assets.json) and the
      # Rust source the element table is generated from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            site
            components/assets/fonts/geist
            bindings/rust/openui/src
            bindings/rust/openui-engine/src

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the pinned site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Check the element table against the Rust source
        working-directory: site
        run: npm run check-reference

      - name: Build (copies and verifies the assets first)
        working-directory: site
        run: npm run build

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: site-deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is enabled in the repository settings (Source: GitHub
      # Actions), not by this workflow. Until it is, skip with a notice
      # instead of failing main.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::Enable GitHub Pages with Source: GitHub Actions in Settings > Pages, then rerun this workflow."
          fi

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
