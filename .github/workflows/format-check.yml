name: Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format-18

      - name: Check tracked C and C++ formatting
        run: |
          find src include examples -type f \
            \( -name '*.cc' -o -name '*.h' -o -name '*.c' \) \
            -print0 | sort -z | \
            xargs -0 --no-run-if-empty clang-format-18 --dry-run --Werror

  gn-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install GN
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends generate-ninja

      - name: Check tracked GN formatting
        run: git ls-files -z '*.gn' '*.gni' | xargs -0 --no-run-if-empty -n1 gn format --dry-run
