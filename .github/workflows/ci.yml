name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-parity:
    name: rust-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The checked-in Cargo config describes the pinned Chromium pixel runner.
      # Public CI deliberately uses the hosted runner toolchain instead.
      BINDGEN_EXTRA_CLANG_ARGS: ""
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
      CC: clang
      CLANGCC: clang
      CLANGCXX: clang++
      CXX: clang++
      CXXFLAGS: ""
      FORCE_SKIA_BUILD: "1"
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      PKG_CONFIG_SYSROOT_DIR: ""
      # The fragmented multicol integration case exceeds libtest's 2 MiB
      # worker-thread default; application threads use a larger stack.
      RUST_MIN_STACK: "4194304"
      SKIA_GN_ARGS: >-
        extra_cflags += [ "-DSK_SUPPORT_LEGACY_CONIC_CHOP",
        "-DSK_USE_FREETYPE_EMBOLDEN", "-DSK_GAMMA_EXPONENT=1.2",
        "-DSK_GAMMA_CONTRAST=0.2", "-fno-strict-aliasing", "-msse3" ]
      SKIA_NINJA_COMMAND: ninja
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust and Skia build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang curl libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev ninja-build pkg-config python3
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustup default 1.94.1

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            bindings/rust/target
          key: rust-parity-v1-${{ runner.os }}-1.94.1-${{ hashFiles('bindings/rust/Cargo.lock', 'bindings/rust/Cargo.toml', 'bindings/rust/**/Cargo.toml') }}

      - name: Check Rust formatting
        working-directory: bindings/rust
        run: cargo fmt --all --check

      - name: Run parity-relevant Rust tests
        working-directory: bindings/rust
        run: >-
          cargo --config 'target.x86_64-unknown-linux-gnu.rustflags=[]'
          test --locked
          --package openui-style
          --package openui-text
          --package openui-layout
          --package openui-paint
          --package openui-compositor
          --package openui-engine
          --package openui-macros
          --package openui
          --package openui-ffi

      - name: Build and verify the C ABI
        run: |
          cargo build --manifest-path bindings/rust/Cargo.toml \
            --config 'target.x86_64-unknown-linux-gnu.rustflags=[]' \
            --locked --package openui-ffi
          python3 tools/ffi/verify_abi.py

  frozen-pixel-replay:
    name: frozen-pixel-replay
    needs: rust-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BINDGEN_EXTRA_CLANG_ARGS: ""
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
      CC: clang
      CLANGCC: clang
      CLANGCXX: clang++
      CXX: clang++
      CXXFLAGS: ""
      FORCE_SKIA_BUILD: "1"
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      PKG_CONFIG_SYSROOT_DIR: ""
      RUST_MIN_STACK: "4194304"
      SKIA_GN_ARGS: >-
        extra_cflags += [ "-DSK_SUPPORT_LEGACY_CONIC_CHOP",
        "-DSK_USE_FREETYPE_EMBOLDEN", "-DSK_GAMMA_EXPONENT=1.2",
        "-DSK_GAMMA_CONTRAST=0.2", "-fno-strict-aliasing", "-msse3" ]
      SKIA_NINJA_COMMAND: ninja
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust and Skia build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang curl libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev ninja-build pkg-config python3 python3-pil
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            bindings/rust/target
          key: rust-parity-v1-${{ runner.os }}-1.94.1-${{ hashFiles('bindings/rust/Cargo.lock', 'bindings/rust/Cargo.toml', 'bindings/rust/**/Cargo.toml') }}

      - name: Restore immutable frozen OpenUI PNGs
        run: python3 tools/accountability/restore_frozen_openui_archive.py --restore

      - name: Replay frozen Open UI pixels
        run: |
          cargo build --manifest-path bindings/rust/Cargo.toml \
            --config 'target.x86_64-unknown-linux-gnu.rustflags=[]' \
            --locked --package pixel-compare
          python3 tools/accountability/verify_frozen_openui_pixels.py \
            --pixel-compare bindings/rust/target/debug/pixel_compare --jobs 4 \
            --report "$RUNNER_TEMP/frozen-replay-summary.json"

      - name: Upload frozen replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-replay-summary
          path: ${{ runner.temp }}/frozen-replay-summary.json
          if-no-files-found: warn

      - name: Require exact provenance for frozen pass records
        if: always()
        run: python3 tools/accountability/audit_frozen_oracle.py --require-original-exact

  python-accountability:
    name: python-accountability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install Chromium-locked Acorn parser
        run: |
          parser_root="$RUNNER_TEMP/chromium-acorn"
          npm install --prefix "$parser_root" --no-save --ignore-scripts \
            --no-package-lock --no-audit --no-fund --no-progress acorn@8.14.0
          parser="$parser_root/node_modules/acorn/dist/acorn.mjs"
          test "$(sha256sum "$parser" | cut -d ' ' -f 1)" = \
            402f6759c744ea2ca501c1dc4ded8b1c54c9066cc7a741837057dcb68bc64c93
          printf 'CHROMIUM_ACORN=%s\n' "$parser" >> "$GITHUB_ENV"

      - name: Fetch pinned Chromium 147 WPT sources
        run: |
          chromium_src="$RUNNER_TEMP/chromium-src"
          chromium_commit=09d377d9438dc95267369f74a073acd81bdde38f
          git init --quiet "$chromium_src"
          git -C "$chromium_src" remote add origin https://github.com/chromium/chromium.git
          git -C "$chromium_src" sparse-checkout init --cone
          git -C "$chromium_src" sparse-checkout set \
            third_party/blink/web_tests/external/wpt/css \
            third_party/blink/web_tests/external/wpt/fonts \
            third_party/blink/web_tests/external/wpt/images \
            third_party/blink/web_tests/external/wpt/media
          git -C "$chromium_src" fetch --depth 1 --filter=blob:none origin "$chromium_commit"
          git -C "$chromium_src" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$chromium_src" rev-parse HEAD)" = "$chromium_commit"
          wpt_root="$chromium_src/third_party/blink/web_tests/external/wpt"
          test -f "$wpt_root/css/CSS2/floats/adjoining-floats-dynamic.html"
          printf 'CHROMIUM_WPT_ROOT=%s\nCHROMIUM_WPT_CSS=%s\n' \
            "$wpt_root" "$wpt_root/css" >> "$GITHUB_ENV"

      - name: Run frozen closure and porter tests
        run: |
          python3 -m unittest \
            tools.accountability.test_audit_frozen_oracle \
            tools.wpt.test_sp13p_paint_closure \
            tools.wpt.test_sp13r_multicol_closure \
            tools.wpt.test_sp14_text_port \
            tools.wpt.test_sp15_closure \
            tools.wpt.test_sp16_closure \
            tools.wpt.test_sp17_closure \
            tools.wpt.test_sp18_closure \
            tools.wpt.test_sp19_closure \
            tools.wpt.test_sp20_closure

      - name: Verify immutable closure ledgers
        run: |
          python3 tools/accountability/restore_frozen_openui_archive.py --check
          python3 tools/qualification/generate_renderer_contract.py --check
          python3 tools/wpt/generate_sp13r_multicol_closure.py --check
          python3 tools/wpt/generate_sp17_closure.py --check
          python3 tools/wpt/generate_sp18_closure.py --check
          python3 tools/wpt/generate_sp20_closure.py --check
          python3 tools/release/generate_v02_contract.py --check
          python3 tools/style/generate_properties.py --check
          python3 tools/ffi/generate_ffi.py --check
          python3 tools/release/build_v02_linux.py --verify-source
          python3 -m unittest tools.release.test_v02_packaging
          python3 tools/conformance/verify_v02.py
          python3 tools/performance/verify_v02.py
          python3 tools/performance/verify_v02.py \
            tools/performance/results/local-wsl2-2026-09-13.json

      - name: Audit authoritative accountability artifacts
        run: python3 tools/accountability/audit.py --repository-only
