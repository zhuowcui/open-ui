name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    # The reviewed lockfile audit is its own job so a dependency advisory
    # never hides the Rust test results; it remains a required, strict gate.
    name: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1

      - name: Install the pinned dependency audit tool
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/openui-audit-tool-target" \
            cargo +1.94.1 install cargo-audit --version =0.22.2 --locked \
              --root "$RUNNER_TEMP/openui-audit-tool"
          printf 'OPENUI_CARGO_AUDIT=%s\n' \
            "$RUNNER_TEMP/openui-audit-tool/bin/cargo-audit" >> "$GITHUB_ENV"

      - name: Enforce dependency security for both reviewed lockfiles
        run: |
          python3 -m unittest tools.release.test_dependency_security
          python3 tools/release/check_dependency_security.py \
            --output "$RUNNER_TEMP/dependency-security/ci"

      - name: Preserve dependency security diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-ci
          path: ${{ runner.temp }}/dependency-security/
          if-no-files-found: error

  rust-parity:
    name: rust-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The checked-in Cargo config describes the pinned Chromium pixel runner.
      # Public CI deliberately uses the hosted runner toolchain instead.
      BINDGEN_EXTRA_CLANG_ARGS: ""
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
      CC: clang
      CLANGCC: clang
      CLANGCXX: clang++
      CXX: clang++
      CXXFLAGS: ""
      FORCE_SKIA_BUILD: "1"
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      PKG_CONFIG_SYSROOT_DIR: ""
      # The fragmented multicol integration case exceeds libtest's 2 MiB
      # worker-thread default; application threads use a larger stack.
      RUST_MIN_STACK: "4194304"
      SKIA_GN_ARGS: >-
        extra_cflags += [ "-DSK_SUPPORT_LEGACY_CONIC_CHOP",
        "-DSK_ENABLE_LEGACY_SHADERCONTEXT",
        "-DSK_USE_FREETYPE_EMBOLDEN", "-DSK_GAMMA_EXPONENT=1.2",
        "-DSK_GAMMA_CONTRAST=0.2", "-fno-strict-aliasing", "-msse3" ]
      SKIA_NINJA_COMMAND: ninja
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust and Skia build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang curl libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev ninja-build pkg-config python3
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustup default 1.94.1

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            bindings/rust/target
          key: rust-parity-v1-${{ runner.os }}-1.94.1-${{ hashFiles('bindings/rust/Cargo.lock', 'bindings/rust/Cargo.toml', 'bindings/rust/**/Cargo.toml') }}

      - name: Check Rust formatting
        working-directory: bindings/rust
        run: cargo fmt --all --check

      - name: Build and verify the C ABI
        run: |
          cargo build --manifest-path bindings/rust/Cargo.toml \
            --config 'target.x86_64-unknown-linux-gnu.rustflags=[]' \
            --locked --package openui-ffi
          python3 tools/ffi/verify_abi.py

      - name: Run parity-relevant Rust tests
        working-directory: bindings/rust
        run: >-
          cargo --config 'target.x86_64-unknown-linux-gnu.rustflags=[]'
          test --locked --no-fail-fast
          --package openui-style
          --package openui-text
          --package openui-layout
          --package openui-paint
          --package openui-compositor
          --package openui-engine
          --package openui-macros
          --package openui
          --package openui-ffi

  windows-msvc:
    name: windows-msvc
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\out\cargo-win
      FORCE_SKIA_BUILD: "1"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      PYTHONUTF8: "1"
      RUST_MIN_STACK: "4194304"
      SKIA_GN_ARGS: >-
        extra_cflags += [ "-DSK_SUPPORT_LEGACY_CONIC_CHOP",
        "-DSK_ENABLE_LEGACY_SHADERCONTEXT",
        "-DSK_USE_FREETYPE_EMBOLDEN", "-DSK_GAMMA_EXPONENT=1.2",
        "-DSK_GAMMA_CONTRAST=0.2", "-fno-strict-aliasing", "-msse3" ]
      SKIA_NINJA_COMMAND: ninja
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths before checkout
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install Rust, Ninja and Python test dependencies
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustup default 1.94.1
          python -m pip install Pillow==12.2.0 clang-format==18.1.8 ninja==1.13.0

      - name: Install Chromium-locked Acorn parser
        run: |
          parser_root="$RUNNER_TEMP/chromium-acorn"
          npm install --prefix "$parser_root" --no-save --ignore-scripts \
            --no-package-lock --no-audit --no-fund --no-progress acorn@8.14.0
          parser="$parser_root/node_modules/acorn/dist/acorn.mjs"
          # Hash stdin: sha256sum escapes output for paths with backslashes.
          test "$(sha256sum < "$parser" | cut -d ' ' -f 1)" = \
            402f6759c744ea2ca501c1dc4ded8b1c54c9066cc7a741837057dcb68bc64c93
          printf 'CHROMIUM_ACORN=%s\n' "$parser" >> "$GITHUB_ENV"

      - name: Fetch pinned Chromium 147 WPT sources
        run: |
          # Keep upstream bytes exact; Windows runners default to autocrlf.
          chromium_src="$RUNNER_TEMP/chromium-src"
          chromium_commit=09d377d9438dc95267369f74a073acd81bdde38f
          git -c core.autocrlf=false init --quiet "$chromium_src"
          git -C "$chromium_src" config core.autocrlf false
          git -C "$chromium_src" remote add origin https://github.com/chromium/chromium.git
          git -C "$chromium_src" sparse-checkout init --cone
          git -C "$chromium_src" sparse-checkout set \
            third_party/blink/web_tests/external/wpt/css \
            third_party/blink/web_tests/external/wpt/fonts \
            third_party/blink/web_tests/external/wpt/images \
            third_party/blink/web_tests/external/wpt/media
          git -C "$chromium_src" fetch --depth 1 --filter=blob:none origin "$chromium_commit"
          git -C "$chromium_src" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$chromium_src" rev-parse HEAD)" = "$chromium_commit"
          wpt_root="$chromium_src/third_party/blink/web_tests/external/wpt"
          printf 'CHROMIUM_WPT_ROOT=%s\nCHROMIUM_WPT_CSS=%s\n' \
            "$wpt_root" "$wpt_root/css" >> "$GITHUB_ENV"

      - name: Verify the Windows-pending test ledger
        run: |
          python -m unittest tools.ci.test_check_platform_scoped_tests
          python tools/ci/check_platform_scoped_tests.py

      - name: Run closure, porter, renderer, packaging and security tool tests
        run: |
          python -m unittest \
            tools.accountability.test_audit_frozen_oracle \
            tools.accountability.test_chromium_capture \
            tools.wpt.test_sp13p_paint_closure \
            tools.wpt.test_sp13r_multicol_closure \
            tools.wpt.test_sp14_text_port \
            tools.wpt.test_sp15_closure \
            tools.wpt.test_sp16_closure \
            tools.wpt.test_sp17_closure \
            tools.wpt.test_sp18_closure \
            tools.wpt.test_sp19_closure \
            tools.wpt.test_sp20_closure \
            tools.qualification.test_build_renderer \
            tools.qualification.test_renderer_matrix \
            tools.qualification.test_summarize_renderer_census \
            tools.qualification.test_windows_chrome \
            tools.style.test_generate_properties \
            tools.release.test_v02_packaging \
            tools.release.test_dependency_security

      - name: Verify immutable closure ledgers byte for byte
        run: |
          python tools/accountability/restore_frozen_openui_archive.py --check
          python tools/qualification/generate_renderer_contract.py --check
          python tools/wpt/generate_sp13r_multicol_closure.py --check
          python tools/wpt/generate_sp17_closure.py --check
          python tools/wpt/generate_sp18_closure.py --check
          python tools/wpt/generate_sp20_closure.py --check
          python tools/release/generate_v02_contract.py --check
          python tools/style/generate_properties.py --check
          python tools/ffi/generate_ffi.py --check
          python tools/ffi/generate_form_owner_cases.py --check
          python tools/ffi/generate_control_keyboard_cases.py --check
          python tools/accountability/audit.py --repository-only

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            out/cargo-win
          key: windows-msvc-v1-1.94.1-${{ hashFiles('bindings/rust/Cargo.lock', 'bindings/rust/Cargo.toml', 'bindings/rust/**/Cargo.toml') }}

      - name: Build the headless workspace
        working-directory: bindings/rust
        run: cargo build --workspace --locked

      - name: Build and verify the C ABI DLL and consumers
        run: |
          cargo build --manifest-path bindings/rust/Cargo.toml --locked --package openui-ffi
          python tools/ffi/verify_abi.py --library "$CARGO_TARGET_DIR/debug/openui_ffi.dll"

      - name: Build and smoke the Win32 desktop runtime
        run: |
          features="openui-platform/windows openui/windows openui-ffi/windows hello/windows"
          cargo build --manifest-path bindings/rust/Cargo.toml --locked \
            --package openui-ffi --package hello --features "$features"
          cargo test --manifest-path bindings/rust/Cargo.toml --locked --no-fail-fast \
            --package openui-platform --package openui --package openui-ffi \
            --features "openui-platform/windows openui/windows openui-ffi/windows"
          OUI_BACKEND=software OUI_SMOKE_EXIT=1 "$CARGO_TARGET_DIR/debug/hello.exe"
          python tools/ffi/verify_native_window.py \
            --library "$CARGO_TARGET_DIR/debug/openui_ffi.dll" \
            --protocol win32 --backend software

      - name: Drive the accessibility example through UI Automation
        run: |
          cargo build --manifest-path bindings/rust/Cargo.toml --locked \
            --package accessibility --features windows
          OUI_BACKEND=software pwsh -NoProfile -File tools/platform/verify_windows_uia.ps1 \
            -Executable "$CARGO_TARGET_DIR/debug/accessibility.exe"

      - name: Run the headless workspace tests
        working-directory: bindings/rust
        run: >-
          cargo test --locked --no-fail-fast
          --package openui-style
          --package openui-text
          --package openui-layout
          --package openui-paint
          --package openui-compositor
          --package openui-engine
          --package openui-macros
          --package openui
          --package openui-ffi

      - name: Confirm LF checkout bytes are unchanged
        run: git diff --exit-code

  historical-pixel-audit:
    name: historical-pixel-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Verify historical archive integrity and comparator metadata
        run: |
          python3 tools/accountability/restore_frozen_openui_archive.py --check
          python3 tools/accountability/audit_frozen_oracle.py \
            --output "$RUNNER_TEMP/historical-pixel-audit.json"

      - name: Upload historical audit
        uses: actions/upload-artifact@v4
        with:
          name: historical-pixel-audit
          path: ${{ runner.temp }}/historical-pixel-audit.json
          if-no-files-found: error

  python-accountability:
    name: python-accountability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer evidence test dependency
        run: python3 -m pip install Pillow==12.2.0 clang-format==18.1.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install Chromium-locked Acorn parser
        run: |
          parser_root="$RUNNER_TEMP/chromium-acorn"
          npm install --prefix "$parser_root" --no-save --ignore-scripts \
            --no-package-lock --no-audit --no-fund --no-progress acorn@8.14.0
          parser="$parser_root/node_modules/acorn/dist/acorn.mjs"
          test "$(sha256sum "$parser" | cut -d ' ' -f 1)" = \
            402f6759c744ea2ca501c1dc4ded8b1c54c9066cc7a741837057dcb68bc64c93
          printf 'CHROMIUM_ACORN=%s\n' "$parser" >> "$GITHUB_ENV"

      - name: Fetch pinned Chromium 147 WPT sources
        run: |
          chromium_src="$RUNNER_TEMP/chromium-src"
          chromium_commit=09d377d9438dc95267369f74a073acd81bdde38f
          git init --quiet "$chromium_src"
          git -C "$chromium_src" remote add origin https://github.com/chromium/chromium.git
          git -C "$chromium_src" sparse-checkout init --cone
          git -C "$chromium_src" sparse-checkout set \
            third_party/blink/web_tests/external/wpt/css \
            third_party/blink/web_tests/external/wpt/fonts \
            third_party/blink/web_tests/external/wpt/images \
            third_party/blink/web_tests/external/wpt/media
          git -C "$chromium_src" fetch --depth 1 --filter=blob:none origin "$chromium_commit"
          git -C "$chromium_src" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$chromium_src" rev-parse HEAD)" = "$chromium_commit"
          wpt_root="$chromium_src/third_party/blink/web_tests/external/wpt"
          test -f "$wpt_root/css/CSS2/floats/adjoining-floats-dynamic.html"
          printf 'CHROMIUM_WPT_ROOT=%s\nCHROMIUM_WPT_CSS=%s\n' \
            "$wpt_root" "$wpt_root/css" >> "$GITHUB_ENV"

      - name: Run closure, porter, and renderer evidence tests
        run: |
          python3 -m unittest \
            tools.accountability.test_audit_frozen_oracle \
            tools.accountability.test_chromium_capture \
            tools.wpt.test_sp13p_paint_closure \
            tools.wpt.test_sp13r_multicol_closure \
            tools.wpt.test_sp14_text_port \
            tools.wpt.test_sp15_closure \
            tools.wpt.test_sp16_closure \
            tools.wpt.test_sp17_closure \
            tools.wpt.test_sp18_closure \
            tools.wpt.test_sp19_closure \
            tools.wpt.test_sp20_closure \
            tools.qualification.test_build_renderer \
            tools.qualification.test_renderer_matrix \
            tools.qualification.test_summarize_renderer_census \
            tools.qualification.test_windows_chrome \
            tools.style.test_generate_properties \
            tools.ci.test_check_platform_scoped_tests

      - name: Verify immutable closure ledgers
        run: |
          python3 tools/ci/check_platform_scoped_tests.py
          python3 tools/accountability/restore_frozen_openui_archive.py --check
          python3 tools/qualification/generate_renderer_contract.py --check
          python3 tools/wpt/generate_sp13r_multicol_closure.py --check
          python3 tools/wpt/generate_sp17_closure.py --check
          python3 tools/wpt/generate_sp18_closure.py --check
          python3 tools/wpt/generate_sp20_closure.py --check
          python3 tools/release/generate_v02_contract.py --check
          python3 tools/style/generate_properties.py --check
          python3 tools/ffi/generate_ffi.py --check
          python3 tools/ffi/generate_form_owner_cases.py --check
          python3 tools/ffi/generate_control_keyboard_cases.py --check
          python3 tools/release/build_v02_linux.py --verify-source
          python3 -m unittest tools.release.test_v02_packaging
          python3 tools/conformance/verify_v02.py
          python3 tools/performance/verify_v02.py
          python3 tools/performance/verify_v02.py \
            tools/performance/results/local-wsl2-2026-09-13.json

      - name: Audit authoritative accountability artifacts
        run: python3 tools/accountability/audit.py --repository-only
