name: v0.2 Hardening

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BINDGEN_EXTRA_CLANG_ARGS: ""
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
  CC: clang
  CXX: clang++
  CXXFLAGS: ""
  CARGO_TERM_COLOR: always
  FORCE_SKIA_BUILD: "1"
  PKG_CONFIG_SYSROOT_DIR: ""
  SKIA_GN_ARGS: >-
    extra_cflags += [ "-DSK_SUPPORT_LEGACY_CONIC_CHOP",
    "-DSK_USE_FREETYPE_EMBOLDEN", "-DSK_GAMMA_EXPONENT=1.2",
    "-DSK_GAMMA_CONTRAST=0.2", "-fno-strict-aliasing", "-msse3" ]
  SKIA_NINJA_COMMAND: ninja

jobs:
  conformance-and-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain and Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libxkbcommon-dev mesa-utils \
            ninja-build pkg-config python3 weston xvfb
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustup default 1.94.1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            bindings/rust/target
          key: v02-hardening-${{ runner.os }}-1.94.1-${{ hashFiles('bindings/rust/Cargo.lock', 'bindings/rust/**/Cargo.toml') }}
      - name: Verify scenario and performance schemas
        run: |
          python3 tools/conformance/verify_v02.py
          python3 tools/performance/verify_v02.py
          python3 tools/performance/verify_v02.py \
            tools/performance/results/local-wsl2-2026-09-13.json
      - name: Run application conformance suite
        working-directory: bindings/rust
        run: cargo test --locked --package openui --test v02_conformance -- --test-threads=1
      - name: Build Linux example
        working-directory: bindings/rust
        run: cargo build --locked --package hello --features linux
      - name: Smoke-test X11 with Mesa OpenGL
        working-directory: bindings/rust
        run: xvfb-run --auto-servernum env OUI_BACKEND=opengl OUI_SMOKE_EXIT=1 target/debug/hello
      - name: Smoke-test pure Wayland software presentation
        working-directory: bindings/rust
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/openui-wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-openui --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" || true' EXIT
          for attempt in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/wayland-openui" && break
            sleep 0.1
          done
          env -u DISPLAY WAYLAND_DISPLAY=wayland-openui OUI_BACKEND=software OUI_SMOKE_EXIT=1 target/debug/hello

  miri-handles:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned nightly Miri
        run: rustup toolchain install nightly-2026-09-01 --profile minimal --component miri,rust-src
      - name: Exercise safe generation-checked handles
        working-directory: bindings/rust
        run: cargo +nightly-2026-09-01 miri test --package openui-engine stale_and_cross_document_handles_are_rejected

  native-sanitizers:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak]
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev ninja-build pkg-config
          rustup toolchain install nightly-2026-09-01 --profile minimal --component rust-src
      - name: Run C ABI negative tests under sanitizer
        working-directory: bindings/rust
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
        run: >-
          cargo +nightly-2026-09-01 test -Zbuild-std
          --target x86_64-unknown-linux-gnu --package openui-ffi

  c-undefined-sanitizer:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev lld ninja-build pkg-config
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - name: Build Rust library and exercise C consumers under UBSan
        run: |
          cargo build --manifest-path bindings/rust/Cargo.toml --locked --package openui-ffi
          CC=clang CXX=clang++ \
            CFLAGS=-fsanitize=undefined CXXFLAGS=-fsanitize=undefined \
            LDFLAGS=-fsanitize=undefined \
            python3 tools/ffi/verify_abi.py

  fuzz-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install fuzz toolchain and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev ninja-build pkg-config
          rustup toolchain install nightly-2026-09-01 --profile minimal
          cargo +nightly-2026-09-01 install cargo-fuzz --locked
      - name: Run each fuzz target
        working-directory: bindings/rust/fuzz
        run: |
          for target in ffi_style_values tree_mutations event_sequences resources animation_sampling; do
            cargo +nightly-2026-09-01 fuzz run "$target" -- -max_total_time=30
          done
