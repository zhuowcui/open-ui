name: components

# The components track (components/): the pinned shadcn/ui reference pages,
# the comparison harness's unit tests, and the components workspace over
# the public `openui` crate. Pixel comparisons need the pinned Chromium and
# run locally; their results are committed under components/evidence/.

on:
  push:
    branches: [main]
    paths:
      - "components/**"
      - "bindings/rust/**"
      - "docs/renderer/generated/qualification-contract-v2.json"
      - "tools/accountability/run_all_pixel_comparisons.py"
      - ".github/workflows/components.yml"
  pull_request:
    paths:
      - "components/**"
      - "bindings/rust/**"
      - "docs/renderer/generated/qualification-contract-v2.json"
      - "tools/accountability/run_all_pixel_comparisons.py"
      - ".github/workflows/components.yml"

permissions:
  contents: read

jobs:
  reference:
    name: components-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the harness test dependency
        run: python3 -m pip install Pillow==12.2.0

      - name: Install the pinned reference build
        working-directory: components/reference
        run: npm ci --no-audit --no-fund

      - name: Reference pages are current
        working-directory: components/reference
        run: node build.mjs --check

      - name: Harness unit tests
        run: python3 -m unittest components/harness/test_reference_harness.py

  rust:
    name: components-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BINDGEN_EXTRA_CLANG_ARGS: ""
      CC: clang
      CLANGCC: clang
      CLANGCXX: clang++
      CXX: clang++
      CXXFLAGS: ""
      FORCE_SKIA_BUILD: "1"
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      PKG_CONFIG_SYSROOT_DIR: ""
      RUST_MIN_STACK: "4194304"
      SKIA_GN_ARGS: >-
        extra_cflags += [ "-DSK_SUPPORT_LEGACY_CONIC_CHOP",
        "-DSK_ENABLE_LEGACY_SHADERCONTEXT",
        "-DSK_USE_FREETYPE_EMBOLDEN", "-DSK_GAMMA_EXPONENT=1.2",
        "-DSK_GAMMA_CONTRAST=0.2", "-USK_GAMMA_APPLY_TO_A8", "-fno-strict-aliasing", "-msse3" ]
      SKIA_NINJA_COMMAND: ninja
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust and Skia build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang curl libclang-18-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev ninja-build pkg-config python3
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustup default 1.94.1

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            components/target
          key: components-v1-${{ runner.os }}-1.94.1-${{ hashFiles('components/Cargo.lock', 'components/**/Cargo.toml', 'bindings/rust/**/Cargo.toml') }}

      - name: Check Rust formatting
        working-directory: components
        run: cargo fmt --all --check

      - name: Test the components workspace
        working-directory: components
        run: cargo test --locked --no-fail-fast
