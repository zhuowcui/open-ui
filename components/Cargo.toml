# The components track's workspace. It consumes only the public `openui`
# crate from bindings/rust, so it repeats that workspace's patches: the
# pinned rust-skia revision and the vendored font backports. Add the
# zbus_xml backport if a member enables the `linux` platform feature.
[workspace]
resolver = "2"
members = ["openui-components", "reference-render"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/zhuowcui/open-ui"
publish = false

[workspace.dependencies]
openui = { version = "=0.2.0", path = "../bindings/rust/openui" }
openui-components = { path = "openui-components" }
serde_json = "1.0"

[patch.crates-io]
skia-safe = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skia-bindings = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skrifa = { path = "../bindings/rust/vendor/skrifa-v0_40" }
read-fonts = { path = "../bindings/rust/vendor/read-fonts-v0_37" }
font-types = { path = "../bindings/rust/vendor/font-types-v0_11" }
bytemuck = { path = "../bindings/rust/vendor/bytemuck-v1" }
bytemuck_derive = { path = "../bindings/rust/vendor/bytemuck_derive-v1" }
