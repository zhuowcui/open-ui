<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>theme-tokens</title>
<link rel="stylesheet" href="reference.css">
</head>
<body>
<section data-theme-scope="light">
<div data-theme="light" data-token="background" style="color: var(--background)"></div>
<div data-theme="light" data-token="foreground" style="color: var(--foreground)"></div>
<div data-theme="light" data-token="card" style="color: var(--card)"></div>
<div data-theme="light" data-token="card-foreground" style="color: var(--card-foreground)"></div>
<div data-theme="light" data-token="popover" style="color: var(--popover)"></div>
<div data-theme="light" data-token="popover-foreground" style="color: var(--popover-foreground)"></div>
<div data-theme="light" data-token="primary" style="color: var(--primary)"></div>
<div data-theme="light" data-token="primary-foreground" style="color: var(--primary-foreground)"></div>
<div data-theme="light" data-token="secondary" style="color: var(--secondary)"></div>
<div data-theme="light" data-token="secondary-foreground" style="color: var(--secondary-foreground)"></div>
<div data-theme="light" data-token="muted" style="color: var(--muted)"></div>
<div data-theme="light" data-token="muted-foreground" style="color: var(--muted-foreground)"></div>
<div data-theme="light" data-token="accent" style="color: var(--accent)"></div>
<div data-theme="light" data-token="accent-foreground" style="color: var(--accent-foreground)"></div>
<div data-theme="light" data-token="destructive" style="color: var(--destructive)"></div>
<div data-theme="light" data-token="border" style="color: var(--border)"></div>
<div data-theme="light" data-token="input" style="color: var(--input)"></div>
<div data-theme="light" data-token="ring" style="color: var(--ring)"></div>
<div data-theme="light" data-token="chart-1" style="color: var(--chart-1)"></div>
<div data-theme="light" data-token="chart-2" style="color: var(--chart-2)"></div>
<div data-theme="light" data-token="chart-3" style="color: var(--chart-3)"></div>
<div data-theme="light" data-token="chart-4" style="color: var(--chart-4)"></div>
<div data-theme="light" data-token="chart-5" style="color: var(--chart-5)"></div>
<div data-theme="light" data-token="sidebar" style="color: var(--sidebar)"></div>
<div data-theme="light" data-token="sidebar-foreground" style="color: var(--sidebar-foreground)"></div>
<div data-theme="light" data-token="sidebar-primary" style="color: var(--sidebar-primary)"></div>
<div data-theme="light" data-token="sidebar-primary-foreground" style="color: var(--sidebar-primary-foreground)"></div>
<div data-theme="light" data-token="sidebar-accent" style="color: var(--sidebar-accent)"></div>
<div data-theme="light" data-token="sidebar-accent-foreground" style="color: var(--sidebar-accent-foreground)"></div>
<div data-theme="light" data-token="sidebar-border" style="color: var(--sidebar-border)"></div>
<div data-theme="light" data-token="sidebar-ring" style="color: var(--sidebar-ring)"></div>
</section>
<section class="dark" data-theme-scope="dark">
<div data-theme="dark" data-token="background" style="color: var(--background)"></div>
<div data-theme="dark" data-token="foreground" style="color: var(--foreground)"></div>
<div data-theme="dark" data-token="card" style="color: var(--card)"></div>
<div data-theme="dark" data-token="card-foreground" style="color: var(--card-foreground)"></div>
<div data-theme="dark" data-token="popover" style="color: var(--popover)"></div>
<div data-theme="dark" data-token="popover-foreground" style="color: var(--popover-foreground)"></div>
<div data-theme="dark" data-token="primary" style="color: var(--primary)"></div>
<div data-theme="dark" data-token="primary-foreground" style="color: var(--primary-foreground)"></div>
<div data-theme="dark" data-token="secondary" style="color: var(--secondary)"></div>
<div data-theme="dark" data-token="secondary-foreground" style="color: var(--secondary-foreground)"></div>
<div data-theme="dark" data-token="muted" style="color: var(--muted)"></div>
<div data-theme="dark" data-token="muted-foreground" style="color: var(--muted-foreground)"></div>
<div data-theme="dark" data-token="accent" style="color: var(--accent)"></div>
<div data-theme="dark" data-token="accent-foreground" style="color: var(--accent-foreground)"></div>
<div data-theme="dark" data-token="destructive" style="color: var(--destructive)"></div>
<div data-theme="dark" data-token="border" style="color: var(--border)"></div>
<div data-theme="dark" data-token="input" style="color: var(--input)"></div>
<div data-theme="dark" data-token="ring" style="color: var(--ring)"></div>
<div data-theme="dark" data-token="chart-1" style="color: var(--chart-1)"></div>
<div data-theme="dark" data-token="chart-2" style="color: var(--chart-2)"></div>
<div data-theme="dark" data-token="chart-3" style="color: var(--chart-3)"></div>
<div data-theme="dark" data-token="chart-4" style="color: var(--chart-4)"></div>
<div data-theme="dark" data-token="chart-5" style="color: var(--chart-5)"></div>
<div data-theme="dark" data-token="sidebar" style="color: var(--sidebar)"></div>
<div data-theme="dark" data-token="sidebar-foreground" style="color: var(--sidebar-foreground)"></div>
<div data-theme="dark" data-token="sidebar-primary" style="color: var(--sidebar-primary)"></div>
<div data-theme="dark" data-token="sidebar-primary-foreground" style="color: var(--sidebar-primary-foreground)"></div>
<div data-theme="dark" data-token="sidebar-accent" style="color: var(--sidebar-accent)"></div>
<div data-theme="dark" data-token="sidebar-accent-foreground" style="color: var(--sidebar-accent-foreground)"></div>
<div data-theme="dark" data-token="sidebar-border" style="color: var(--sidebar-border)"></div>
<div data-theme="dark" data-token="sidebar-ring" style="color: var(--sidebar-ring)"></div>
</section>
</body>
</html>
